<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бүртгэлийн форм</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <h1 class="page-title">Бүртгэлийн анкет</h1>
    <p class="page-subtitle">Доорх мэдээллийг үнэн зөв бөглөнө үү. * тэмдэгтэй талбар заавал бөглөнө.</p>
  </header>

  <main>
    <form class="form-card" action="#" method="post">
      <span class="badge">Лаб 3</span>

      <fieldset class="group">
        <legend class="group-title">Хувийн мэдээлэл</legend>

        <div class="field">
          <label class="label" for="name">Нэр *</label>
          <input class="input" type="text" id="name" name="name"
                 required minlength="2" maxlength="40"
                 pattern="[A-Za-zА-Яа-яӨөҮүЁё\- ]{2,40}"
                 title="Зөвхөн үсэг ашиглана (2-40 тэмдэгт)"
                 placeholder="Таны нэр">
        </div>

        <div class="field">
          <label class="label" for="email">Имэйл *</label>
          <input class="input" type="email" id="email" name="email"
                 required placeholder="name@example.com">
        </div>

        <div class="field">
          <label class="label" for="password">
            Нууц үг *
            <span class="help">?
              <span class="tooltip">Хамгийн багадаа 8 тэмдэгт, 1 үсэг, 1 тоо агуулсан байх</span>
            </span>
          </label>
          <input class="input" type="password" id="password" name="password"
                 required minlength="8"
                 pattern="(?=.*[A-Za-z])(?=.*\d).{8,}"
                 title="Хамгийн багадаа 8 тэмдэгт, 1 үсэг, 1 тоо агуулсан байх"
                 placeholder="Хамгийн багадаа 8 тэмдэгт">
        </div>

        <div class="field">
          <label class="label" for="birthdate">Төрсөн огноо *</label>
          <input class="input" type="date" id="birthdate" name="birthdate" required>
        </div>

        <div class="field">
          <label class="label" for="phone">Утасны дугаар</label>
          <input class="input" type="tel" id="phone" name="phone"
                 pattern="[0-9]{8}"
                 title="8 оронтой тоо оруулна"
                 placeholder="99112233">
        </div>
      </fieldset>

      <fieldset class="group">
        <legend class="group-title">Хүйс *</legend>
        <div class="choices">
          <div class="choice">
            <input type="radio" id="male" name="gender" value="male" required>
            <label for="male">Эрэгтэй</label>
          </div>
          <div class="choice">
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Эмэгтэй</label>
          </div>
          <div class="choice">
            <input type="radio" id="other" name="gender" value="other">
            <label for="other">Бусад</label>
          </div>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend class="group-title">Сонирхол</legend>
        <div class="choices">
          <div class="choice">
            <input type="checkbox" id="web" name="interests" value="web">
            <label for="web">Вэб хөгжүүлэлт</label>
          </div>
          <div class="choice">
            <input type="checkbox" id="mobile" name="interests" value="mobile">
            <label for="mobile">Мобайл апп</label>
          </div>
          <div class="choice">
            <input type="checkbox" id="ai" name="interests" value="ai">
            <label for="ai">Хиймэл оюун</label>
          </div>
          <div class="choice">
            <input type="checkbox" id="games" name="interests" value="games">
            <label for="games">Тоглоом хөгжүүлэлт</label>
          </div>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend class="group-title">Нэмэлт мэдээлэл</legend>

        <div class="field">
          <label class="label" for="course">Курс *</label>
          <select class="input" id="course" name="course" required>
            <option value="">-- Сонгоно уу --</option>
            <option value="1">1-р курс</option>
            <option value="2">2-р курс</option>
            <option value="3">3-р курс</option>
            <option value="4">4-р курс</option>
          </select>
        </div>

        <div class="field">
          <label class="label" for="about">Өөрийн тухай</label>
          <textarea class="input" id="about" name="about" rows="4"
                    maxlength="300"></textarea>
        </div>
      </fieldset>

      <div class="choice agree">
        <input type="checkbox" id="agree" name="agree" required>
        <label for="agree">Нөхцөлийг зөвшөөрч байна *</label>
      </div>

      <div class="actions">
        <button class="btn btn-primary" type="submit">Бүртгүүлэх</button>
        <button class="btn btn-secondary" type="reset">Цэвэрлэх</button>
      </div>
    </form>
  </main>

  <footer class="page-footer">
    <p>&copy; 2026 Вэб хөгжүүлэлт, Лаборатори 03</p>
  </footer>
</body>
</html>
